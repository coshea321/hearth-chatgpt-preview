<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="hearth-preview-revision" content="57234b0ce674a58e6dbb34e77d9e410f460beff1">
  <title>Hearth phone preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F7F1E6; }
    body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
    #previewNotice {
      min-height: 48px; padding: 5px 8px 5px 14px; display: flex; align-items: center;
      justify-content: space-between; gap: 8px; color: #fff; background: #61451f;
      font-size: 12px; font-weight: 700; line-height: 1.25;
    }
    #previewControls { display: flex; gap: 6px; }
    #previewNotice button {
      min-width: 44px; min-height: 44px; border: 1px solid rgba(255,255,255,.65);
      border-radius: 8px; color: #fff; background: transparent; font: inherit; cursor: pointer;
    }
    iframe { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #F7F1E6; }
    body.notice-hidden #previewNotice { display: none; }
  </style>
</head>
<body>
  <div id="previewNotice" role="status">
    <span>PHONE PREVIEW · temporary demo data · resets on reload · real Hearth data isolated · 57234b0</span>
    <span id="previewControls">
      <button id="previewReset" type="button">Reset demo</button>
      <button id="previewHide" type="button" aria-label="Hide preview notice">Hide</button>
    </span>
  </div>
  <iframe title="Hearth phone preview" sandbox="allow-scripts" referrerpolicy="no-referrer" src="./_hearth-preview/index.html?v=57234b0ce674a58e6dbb34e77d9e410f460beff1"></iframe>
  <script>
    var previewFrame = document.querySelector('iframe');
    document.querySelector('#previewReset').addEventListener('click', function () {
      previewFrame.src = previewFrame.src;
    });
    document.querySelector('#previewHide').addEventListener('click', function () {
      document.body.classList.add('notice-hidden');
    });
  </script>
</body>
</html>
